<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>悬浮球编辑器</title>
<style>
  :root{
    --bg:#101215; --card:#181c21; --line:#262c34; --fg:#e6edf3; --dim:#8b98a5;
    --pri:#4dd0e1; --ok:#3fb950; --warn:#d29922; --danger:#f85149; --info:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,system-ui,"Noto Sans SC",sans-serif;
       padding:0 0 84px}
  header{position:sticky;top:0;z-index:5;background:#101215ee;backdrop-filter:blur(8px);
         border-bottom:1px solid var(--line);padding:10px 12px}
  .row{display:flex;gap:8px;align-items:center}
  h1{font-size:16px;margin:0 0 8px;font-weight:600}
  h2{font-size:14px;margin:0 0 10px;color:var(--pri);font-weight:600}
  main{padding:12px;display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#141a20}
  .item:last-child{margin-bottom:0}
  label{display:block;font-size:12px;color:var(--dim);margin:6px 0 3px}
  input,select,textarea{width:100%;background:#0d1117;border:1px solid var(--line);border-radius:8px;
        color:var(--fg);padding:9px 10px;font-size:14px;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri)}
  button{background:#21262d;border:1px solid var(--line);color:var(--fg);border-radius:8px;
         padding:8px 12px;font-size:14px;font-family:inherit}
  button:active{background:#2d333b}
  button.pri{background:var(--pri);border-color:var(--pri);color:#04222a;font-weight:600}
  button.mini{padding:4px 8px;font-size:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .bar{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-bottom:8px}
  .bar .t{font-size:13px;color:var(--dim)}
  footer{position:fixed;left:0;right:0;bottom:0;background:#101215f2;backdrop-filter:blur(8px);
         border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:10px;align-items:center;z-index:6}
  footer button{flex:0 0 auto}
  #msg{font-size:13px;color:var(--dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ok{color:var(--ok)} .err{color:var(--danger)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips span{padding:3px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--dim)}
  .hint{font-size:12px;color:var(--dim);margin-top:6px}
  details summary{cursor:pointer;color:var(--dim);font-size:13px}
  pre{background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:10px;
      overflow:auto;font-size:12px;max-height:280px}
</style>
</head>
<body>
<header>
  <h1>悬浮球编辑器</h1>
  <div class="row">
    <input id="inst" placeholder="实例名，例如 WorkBuddy2API" style="flex:1">
    <button id="btnLoad" class="mini">载入</button>
    <button id="btnKey" class="mini">密码</button>
  </div>
</header>
<main id="root"><div class="card">填实例名 → 载入</div></main>
<footer>
  <button id="btnApply" class="pri">应用</button>
  <span id="msg"></span>
</footer>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

let key = new URLSearchParams(location.search).get('adminKey')
  || ((document.cookie.match(/adminKey=([^;]+)/) || [])[1] || '');
let inst = new URLSearchParams(location.search).get('inst') || localStorage.getItem('ballInst') || '';
let cfg = {};
let dirty = false;

const EVENTS = ['battery','battery_low','battery_full','charging','discharging','screen_on','screen_off',
  'unlock','headset_in','headset_out','network','vol','notif'];
const GESTURES = ['click','double','long','long_hold'];
const COLORS = ['primary','ok','warn','danger','info','muted'];
const ACTS = ['expand','collapse','toggle','menu','reload','open','copy','toast','mute','bubble','notify','intent'];
const ARGKEY = {open:'page', mute:'minutes', intent:'endpoint'};
const ACTARG = a => { if(!a) return {k:'',v:''}; const k = ARGKEY[a.type] || (['bubble','notify','copy','toast'].includes(a.type) ? 'text' : ''); return {k, v: k ? (a[k] ?? '') : ''}; };

function msg(t, cls) { const m = $('#msg'); m.textContent = t; m.className = cls || ''; }

async function api(path, opt) {
  opt = opt || {};
  const r = await fetch(path, {
    method: opt.method || 'GET',
    headers: { 'content-type': 'application/json', 'x-admin-key': key },
    body: opt.body
  });
  const txt = await r.text();
  let j; try { j = JSON.parse(txt); } catch (e) { j = { error: txt.slice(0, 300) }; }
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

const isG = (k, p) => k.indexOf(p + '_') === 0 && cfg[k] && typeof cfg[k] === 'object';
function group(p) {
  return Object.keys(cfg).filter(k => isG(k, p))
    .sort((a, b) => (cfg[a].order ?? 99) - (cfg[b].order ?? 99));
}
function renum(p) { group(p).forEach((k, i) => { cfg[k].order = i; }); }
function nextKey(p) {
  const nums = group(p).map(k => parseInt(k.split('_').pop(), 10)).filter(n => !isNaN(n));
  return p + '_' + (nums.length ? Math.max.apply(null, nums) + 1 : 0);
}
function addItem(p, tpl) { const k = nextKey(p); cfg[k] = Object.assign({ order: group(p).length }, tpl); renum(p); dirty = true; render(); }
function delItem(k) { const p = k.split('_')[0]; delete cfg[k]; renum(p); dirty = true; render(); }
function move(k, d) {
  const p = k.split('_')[0], list = group(p), i = list.indexOf(k), j = i + d;
  if (j < 0 || j >= list.length) return;
  const t = list[i]; list[i] = list[j]; list[j] = t;
  list.forEach((kk, idx) => { cfg[kk].order = idx; });
  dirty = true; render();
}

function setPath(path, val) {
  const parts = path.split('.');
  let o = cfg;
  for (let i = 0; i < parts.length - 1; i++) {
    if (!o[parts[i]] || typeof o[parts[i]] !== 'object') o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length - 1]] = val;
  dirty = true;
}

/* ---------- 渲染 ---------- */
function render() {
  const r = $('#root');
  r.innerHTML = '';
  if (!Object.keys(cfg).length) { r.innerHTML = '<div class="card">这个实例还没有球配置</div>'; return; }
  r.appendChild(el(lookCard()));
  r.appendChild(el(itemCard('环', 'ring', ['data','color'], {data:'ctxSoft', color:'primary'},
    (k,o) => `<div class="grid2"><div><label>数据</label><input data-k="${k}.data" value="${esc(o.data||'')}" placeholder="ctxSoft / stats.requests/1000" list="datapaths"></div>
      <div><label>颜色</label><select data-k="${k}.color">${COLORS.map(c=>`<option ${((o.color||'primary')===c)?'selected':''}>${c}</option>`).join('')}</select></div></div>`)));
  r.appendChild(el(itemCard('面板行', 'content', ['label','data','text'], {label:'新行', data:'inst', text:'{{state.inst}}'},
    (k,o) => `<div class="grid2"><div><label>标题</label><input data-k="${k}.label" value="${esc(o.label||'')}"></div>
      <div><label>数据</label><input data-k="${k}.data" value="${esc(o.data||'')}"></div></div>
      <label>正文</label><input data-k="${k}.text" value="${esc(typeof o.text==='string'?o.text:'')}" placeholder="{{state.inst}}">`)));
  r.appendChild(el(itemCard('按钮环', 'radial', [], {label:'新按钮', do:{type:'reload'}},
    (k,o) => `<div class="grid2"><div><label>文字（≤8）</label><input data-k="${k}.label" value="${esc(o.label||'')}"></div>
      <div><label>点了干什么</label>${actSel(k + '.do', o.do)}</div></div>
      <div class="hint">${actArg(k + '.do', o.do)}</div>`)));
  r.appendChild(el(itemCard('手势', 'touch', ['on'], {on:'click', do:{type:'expand'}},
    (k,o) => `<div class="grid2"><div><label>手势</label><select data-k="${k}.on">${GESTURES.map(g=>`<option ${o.on===g?'selected':''}>${g}</option>`).join('')}</select></div>
      ${o.on==='long_hold'
        ? `<div><label>阈值 ms</label><input data-k="${k}.hold" value="${esc(o.hold||500)}"></div>`
        : `<div><label>动作</label>${actSel(k + '.do', o.do)}</div>`}</div>
      ${o.on==='long_hold' ? '' : `<div class="hint">${actArg(k + '.do', o.do)}</div>`}`)));
  r.appendChild(el(itemCard('事件', 'when', ['on'], {on:'battery_low', lt:20, cooldown:600, label:'电量低', do:{type:'bubble', text:'电量 {{event.pct}}%'}},
    (k,o) => `${condHTML(k,o)}<div class="grid2"><div><label>动作</label>${actSel(k + '.do', o.do)}</div>
      <div><label>冷却（秒）</label><input data-k="${k}.cooldown" value="${esc(o.cooldown ?? 30)}"></div></div>
      <div class="hint">${actArg(k + '.do', o.do)}</div>`)));
  r.appendChild(el(itemCard('连锁', 'chain', ['on'], {on:'charging', delay:1, cooldown:60, label:'插电', do:[{type:'bubble',text:'充电中 {{event.pct}}%'},{type:'notify',title:'已插电',text:'{{event.pct}}%'}]},
    (k,o) => `${condHTML(k,o)}
      <label>段间隔（秒）</label><input data-k="${k}.delay" value="${esc(o.delay ?? 0)}">
      <label>动作（按顺序，最多 8 个）</label>
      ${(o.do||[]).map((a,i)=>`<div class="item" style="margin:6px 0"><div class="bar"><span class="t">#${i+1}</span><button class="mini" data-act="chainDel:${k}:${i}">删</button></div>
        ${actSel(k + '.do.' + i, a)}<div class="hint">${actArg(k + '.do.' + i, a)}</div></div>`).join('')}
      <button class="mini" data-act="chainAdd:${k}">+ 动作</button>`)));
  r.appendChild(el(notiCard()));
  r.appendChild(el(jsonCard()));
  refreshDatalist();
}

function condHTML(k, o) {
  return `<label>事件</label><input data-k="${k}.on" value="${esc(o.on||'')}" list="evnames">
    <div class="grid3"><div><label>lt</label><input data-k="${k}.lt" value="${esc(o.lt ?? '')}"></div>
    <div><label>gt</label><input data-k="${k}.gt" value="${esc(o.gt ?? '')}"></div>
    <div><label>field</label><input data-k="${k}.field" value="${esc(o.field||'')}" placeholder="pct"></div></div>
    <div class="grid2"><div><label>eq</label><input data-k="${k}.eq" value="${esc(o.eq||'')}"></div>
    <div><label>match（可带 *）</label><input data-k="${k}.match" value="${esc(o.match||'')}"></div></div>
    <label>名字（日志里怎么称呼）</label><input data-k="${k}.label" value="${esc(o.label||'')}">`;
}

function actSel(path, a) {
  const t = (a && a.type) || 'expand';
  return `<select data-k="${path}.type">${ACTS.map(x=>`<option ${x===t?'selected':''}>${x}</option>`).join('')}</select>`;
}
function actArg(path, a) {
  const {k, v} = ACTARG(a || {});
  if (!k) return '<span class="t">不需要参数</span>';
  const ph = {text:'文本，可写 {{event.pct}}', page:'页面名，如 overview', minutes:'分钟数', endpoint:'/admin/api/…'}[k] || '';
  return `<input data-k="${path}.${k}" value="${esc(v)}" placeholder="${ph}">`;
}

function itemCard(title, prefix, keys, tpl, rowFn) {
  const list = group(prefix);
  return `<div class="card">
    <div class="bar"><h2>${title} <span class="t">${list.length} 条</span></h2>
      <button class="mini" data-act="add:${prefix}">+ 加一条</button></div>
    ${list.map(k => `<div class="item">
      <div class="bar"><span class="t">${k}${prefix==='touch'&&cfg[k].on==='long_hold'?'':' · order '+cfg[k].order}</span>
        <span><button class="mini" data-act="up:${k}">上</button>
        <button class="mini" data-act="down:${k}">下</button>
        <button class="mini" data-act="del:${k}">删</button></span></div>
      ${rowFn(k, cfg[k])}</div>`).join('') || '<div class="t">还没有</div>'}
  </div>`;
}

function lookCard() {
  const s = cfg.ringStyle || {}, p = cfg.perform || {}, b = cfg.bubble || {};
  return `<div class="card"><h2>外观</h2>
    <div class="grid3">
      <div><label>直径 dp</label><input data-k="sizeDp" value="${esc(cfg.sizeDp ?? 54)}"></div>
      <div><label>透明度 %</label><input data-k="perform.alpha" value="${esc(p.alpha ?? 100)}"></div>
      <div><label>缩放</label><input data-k="perform.zoom" value="${esc(p.zoom ?? 1)}"></div>
    </div>
    <div class="grid3">
      <div><label>环画法</label><select data-k="ringStyle.mode">
        <option ${s.mode!=='bars'?'selected':''}>ring</option><option ${s.mode==='bars'?'selected':''}>bars</option></select></div>
      <div><label>线宽</label><input data-k="ringStyle.stroke" value="${esc(s.stroke ?? 2.6)}"></div>
      <div><label>间距</label><input data-k="ringStyle.gap" value="${esc(s.gap ?? 2)}"></div>
    </div>
    <label>按钮环半径 dp</label>
    <input data-k="radial.radius" value="${esc((cfg.radial || {}).radius || 78)}">
    <label>球上方那行字</label>
    <input data-k="bubble.text" value="${esc(typeof b.text==='string'?b.text:'')}" placeholder="{{state.ctxPct}}% · {{state.balance}}">
  </div>`;
}

function notiCard() {
  const n = cfg.noti || {};
  return `<div class="card"><h2>发一条消息</h2>
    <div class="grid2">
      <div><label>发送者</label><input data-k="noti.name" value="${esc(n.name||'网关')}"></div>
      <div><label>静默</label><select data-k="noti.silence">
        <option value="0" ${Number(n.silence)!==1?'selected':''}>0 正常</option>
        <option value="1" ${Number(n.silence)===1?'selected':''}>1 静音</option></select></div>
    </div>
    <label>内容（可写 {{stats.requests}} 拉数据）</label>
    <input data-k="noti.text" value="${esc(n.text||'')}" placeholder="编译完成 12s">
    <button class="pri" data-act="sendNoti" style="width:100%;margin-top:10px">立即发送</button>
    <div class="hint">点「立即发送」先存配置再广播，马上弹；只点「应用」的话 60 秒内自己弹。</div>
  </div>`;
}

function jsonCard() {
  return `<div class="card"><details><summary>看 JSON</summary>
    <pre>${esc(JSON.stringify(cfg, null, 1))}</pre></details>
    <div class="chips">${Object.keys(cfg).length} 个键</div></div>`;
}

function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }

function refreshDatalist() {
  let dl = document.getElementById('dl');
  if (!dl) { dl = document.createElement('div'); dl.id = 'dl'; dl.style.display = 'none'; document.body.appendChild(dl); }
  dl.innerHTML = `<datalist id="evnames">${EVENTS.map(e=>`<option>${e}</option>`).join('')}</datalist>`;
}

/* ---------- 交互 ---------- */
document.addEventListener('input', ev => {
  const t = ev.target;
  const path = t.getAttribute('data-k');
  if (!path) return;
  let v = t.value;
  if (['lt','gt','cooldown','delay','hold','order','sizeDp','stroke','gap','zoom','alpha','radius','silence'].some(n => path.endsWith('.' + n) || path === n)) {
    if (v === '') v = null; else v = Number(v);
  }
  setPath(path, v);
  if (path === 'noti.text' || path === 'bubble.text') { const pre = document.querySelector('details pre'); if (pre) pre.textContent = JSON.stringify(cfg, null, 1); }
  msg('有改动，记得点应用', '');
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.tagName === 'SELECT' && t.getAttribute('data-k') && t.getAttribute('data-k').endsWith('.type')) {
    const path = t.getAttribute('data-k');
    const parts = path.split('.');
    const objPath = parts.slice(0, -1).join('.');
    // 换动作类型时清掉旧参数
    const old = path.split('.').length ? getPath(objPath) : null;
    if (old) { delete old.text; delete old.page; delete old.minutes; delete old.endpoint; }
    setPath(path, t.value);
    render();
  }
});

function getPath(path) {
  const parts = path.split('.'); let o = cfg;
  for (const p of parts) { if (!o || typeof o !== 'object') return null; o = o[p]; }
  return o;
}

document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  const a = b.getAttribute('data-act');
  const [op, arg, arg2] = a.split(':');
  if (op === 'add') addItem(arg, {
    ring: {data:'ctxSoft', color:'primary'},
    content: {label:'新行', data:'inst', text:'{{state.inst}}'},
    radial: {label:'新按钮', do:{type:'reload'}},
    touch: {on:'click', do:{type:'expand'}},
    when: {on:'battery_low', lt:20, cooldown:600, label:'新规则', do:{type:'bubble', text:''}},
    chain: {on:'charging', delay:1, cooldown:60, label:'新连锁', do:[{type:'bubble', text:''}]}
  }[arg]);
  else if (op === 'del') delItem(arg);
  else if (op === 'up') move(arg, -1);
  else if (op === 'down') move(arg, 1);
  else if (op === 'chainAdd') {
    const o = getPath(arg);
    if (o) { o.do = o.do || []; if (o.do.length < 8) o.do.push({type:'bubble', text:''}); dirty = true; render(); }
  } else if (op === 'sendNoti') {
    const ok = await save(true);
    if (!ok) return;
    const n = cfg.noti || {};
    const t = new Date(), p2 = x => String(x).padStart(2, '0');
    const stamp = p2(t.getHours()) + ':' + p2(t.getMinutes()) + ':' + p2(t.getSeconds()) + '.' + String(t.getMilliseconds()).padStart(3, '0');
    n.time = stamp; setPath('noti.time', stamp);
    try {
      await api('/admin/api/ball-trigger', { method: 'POST', body: JSON.stringify({
        on: 'noti', text: n.text || '', time: stamp, silence: n.silence || 0, title: n.name || '悬浮球'
      }) });
      msg('已发送', 'ok');
    } catch (e) { msg('发送失败: ' + e.message, 'err'); }
  } else if (op === 'chainDel') {
    const o = getPath(arg);
    if (o && o.do) { o.do.splice(Number(arg2), 1); dirty = true; render(); }
  }
});

/* ---------- 顶部/底部 ---------- */
$('#inst').value = inst;
$('#inst').addEventListener('change', e => { inst = e.target.value.trim(); localStorage.setItem('ballInst', inst); });

$('#btnLoad').addEventListener('click', async () => {
  inst = $('#inst').value.trim();
  if (!inst) return msg('先填实例名', 'err');
  if (!key) return askKey();
  localStorage.setItem('ballInst', inst);
  msg('载入中…');
  try {
    const j = await api('/admin/api/ball/' + encodeURIComponent(inst));
    cfg = j.look || {};
    dirty = false;
    render();
    msg('已载入 ' + Object.keys(cfg).length + ' 个键  hash ' + (j.hash || ''), 'ok');
  } catch (e) { msg('载入失败: ' + e.message, 'err'); }
});

$('#btnApply').addEventListener('click', () => save(false));

async function save(quiet) {
  if (!inst) return msg('先填实例名', 'err');
  if (!key) return askKey();
  msg('提交中…');
  try {
    const j = await api('/admin/api/ball/' + encodeURIComponent(inst), { method:'POST', body: JSON.stringify({ look: cfg }) });
    dirty = false;
    msg('已保存，双击球立即生效  hash ' + (j.hash || ''), 'ok');
    return true;
  } catch (e) {
    msg('被拒: ' + e.message, 'err');
    return false;
  }
}

$('#btnKey').addEventListener('click', askKey);
function askKey() {
  const k = prompt('管理密码 adminKey（存本地，只发给 127.0.0.1）');
  if (!k) return;
  key = k.trim();
  localStorage.setItem('ballKey', key);
  document.cookie = 'adminKey=' + encodeURIComponent(key) + ';path=/;max-age=86400';
  msg('密码已记住', 'ok');
}
if (!key) { const k = localStorage.getItem('ballKey'); if (k) key = k; }
else { localStorage.setItem('ballKey', key); document.cookie = 'adminKey=' + encodeURIComponent(key) + ';path=/;max-age=86400'; }
if (inst && key) { setTimeout(() => $('#btnLoad').click(), 60); }
if (!inst) {
  fetch('/admin/api/instances', { headers: { 'x-admin-key': key } }).then(r => r.json()).then(j => {
    const name = (j && (j.active || (j.instances && j.instances[0]))) || '';
    if (name && !$('#inst').value) { $('#inst').value = typeof name === 'string' ? name : (name.name || ''); }
  }).catch(() => {});
}
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
