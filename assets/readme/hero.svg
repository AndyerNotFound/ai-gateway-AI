<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">ai-gateway</title>
  <desc id="d">One local endpoint for every AI API dialect: OpenAI, Claude and Gemini clients are converted in every direction and routed to any upstream, with per-channel proxies, key round-robin and failover.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4796E3"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#10A37F"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#D97757"/></marker>
  </defs>
  <rect width="1200" height="400" rx="18" fill="#0D1117"/>

  <!-- left: title block -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <text x="64" y="86" font-size="17" letter-spacing="1.5" fill="#8B949E">ZERO-DEPS · NODE 18+ · TERMUX-NATIVE</text>
  </g>
  <text x="64" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="62" font-weight="700" fill="#E6EDF3">ai-gateway</text>
  <rect x="412" y="116" width="16" height="50" fill="#3FB950"/>
  <text x="64" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" fill="#C9D1D9">One endpoint for every AI API dialect.</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" fill="#8B949E">
    <text x="64" y="240">Clients speak OpenAI, Claude or Gemini — the gateway</text>
    <text x="64" y="266">converts every direction and routes to any upstream.</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#C9D1D9">
    <text x="64" y="306"><tspan fill="#3FB950">●</tspan>  OpenAI ⇄ Claude ⇄ Gemini conversion</text>
    <text x="64" y="334"><tspan fill="#3FB950">●</tspan>  Per-channel SOCKS5 / HTTP proxies</text>
    <text x="64" y="362"><tspan fill="#3FB950">●</tspan>  Key round-robin, failover, redaction</text>
  </g>

  <!-- right: request-flow board -->
  <g>
    <rect x="628" y="48" width="512" height="304" rx="14" fill="#161B27" stroke="#30363D"/>
    <text x="652" y="82" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" letter-spacing="3" fill="#8B949E">REQUEST FLOW</text>

    <!-- clients -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#E6EDF3">
      <rect x="644" y="100" width="160" height="46" rx="10" fill="#0D1117" stroke="#30363D"/><rect x="644" y="100" width="4" height="46" rx="2" fill="#10A37F"/><text x="662" y="129">OpenAI client</text>
      <rect x="644" y="160" width="160" height="46" rx="10" fill="#0D1117" stroke="#30363D"/><rect x="644" y="160" width="4" height="46" rx="2" fill="#D97757"/><text x="662" y="189">Claude client</text>
      <rect x="644" y="220" width="160" height="46" rx="10" fill="#0D1117" stroke="#30363D"/><rect x="644" y="220" width="4" height="46" rx="2" fill="#4796E3"/><text x="662" y="249">Gemini client</text>
    </g>

    <!-- arrows in -->
    <line x1="808" y1="123" x2="838" y2="123" stroke="#10A37F" stroke-width="2" marker-end="url(#ag)"/>
    <line x1="808" y1="183" x2="838" y2="183" stroke="#D97757" stroke-width="2" marker-end="url(#ao)"/>
    <line x1="808" y1="243" x2="838" y2="243" stroke="#4796E3" stroke-width="2" marker-end="url(#ab)"/>

    <!-- gateway core -->
    <rect x="844" y="100" width="124" height="178" rx="12" fill="#1C2333" stroke="#3A4358"/>
    <text x="906" y="140" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#E6EDF3">ai-gateway</text>
    <text x="906" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#3FB950">● :16384</text>
    <line x1="858" y1="186" x2="954" y2="186" stroke="#30363D"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8B949E">
      <text x="906" y="216" text-anchor="middle">converts ⇄</text>
      <text x="906" y="242" text-anchor="middle">redacts</text>
      <text x="906" y="268" text-anchor="middle">balances</text>
    </g>

    <!-- arrows out -->
    <line x1="972" y1="123" x2="1002" y2="123" stroke="#10A37F" stroke-width="2" marker-end="url(#ag)"/>
    <line x1="972" y1="183" x2="1002" y2="183" stroke="#D97757" stroke-width="2" marker-end="url(#ao)"/>
    <line x1="972" y1="243" x2="1002" y2="243" stroke="#4796E3" stroke-width="2" marker-end="url(#ab)"/>

    <!-- upstreams -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#C9D1D9">
      <text x="1014" y="118">DeepSeek ·</text><text x="1014" y="138">relays</text>
      <text x="1014" y="178">Gemini API</text><text x="1014" y="198">official</text>
      <text x="1014" y="238">Claude API</text><text x="1014" y="258">official</text>
    </g>

    <line x1="652" y1="296" x2="1116" y2="296" stroke="#30363D"/>
    <text x="652" y="328" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18"><tspan fill="#8B949E">~ $</tspan><tspan fill="#E6EDF3"> agw.sh start</tspan><tspan fill="#8B949E"> → </tspan><tspan fill="#3FB950">127.0.0.1:16384/v1</tspan></text>
  </g>
</svg>
